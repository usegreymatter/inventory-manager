<script type="module" id="runway-app">
const a3Started=performance.now()
/* STOCK_RUNWAY_CORE_START */
__STOCK_RUNWAY_CORE__/* STOCK_RUNWAY_CORE_END */
/* STOCK_RUNWAY_HELPERS_START */
__HELPERS__/* STOCK_RUNWAY_HELPERS_END */
applyOrderPolicyCopy()
__DESIGN_APP__
__GM_PRESENTATION__
// Template-scoped policy v2 presentation. Never change guidance or forecasts here.
if (document.body.dataset.design === 'option-gm-b') {
  Object.assign(gmSettingLabels, ORDER_POLICY_COPY)
  // Global fields already exist; future supplier/product fields use the same map.
  for (const input of document.querySelectorAll('[data-setting-key]')) {
    const copy = ORDER_POLICY_COPY[input.dataset.settingKey]
    if (!copy) continue
    const field = input.closest('.setting-row')
    field.querySelector('.setting-title').textContent = copy[0]
    const help = field.querySelector('.setting-meaning')
    help.textContent = copy[1]; help.title = copy[1]
    input.title = copy[1]
    field.querySelector('.setting-controls button').setAttribute('aria-label', 'Reset ' + copy[0])
  }
  // Set native tooltips on subsequently opened scoped settings, too.
  const policySettingsField = gmSettingsField
  gmSettingsField = function(...args) {
    const field = policySettingsField(...args), help = field.querySelector('.setting-meaning')
    help.title = help.textContent
    field.querySelector('input,select').title = help.textContent
    return field
  }
  function assumedDeliveryMarker(guidance) {
    if (!guidance.used_default_lead) return null
    const marker = node('span', `Assumed delivery time: ${guidance.lead_days} days`, 'assumed-delivery')
    marker.title = 'Supplier lead time is missing. Using the default delivery time; confirm with your supplier or change Settings.'
    return marker
  }
  // The shared worklist note replaces repeated row badges. Detail keeps provenance.
  const policyChartPanel = chartPanel
  chartPanel = function(row) {
    const panel = policyChartPanel(row), marker = assumedDeliveryMarker(row.guidance)
    if (marker) panel.querySelector('.product-heading').append(marker)
    return panel
  }
  // Decorate the first frame as well as later virtual rows and drawer navigation.
  wlRenderRows()
  const selected = rowMap.get(selectedSku)
  if (selected) selectItem(selected, { hash: false })
}
</script></body></html>
